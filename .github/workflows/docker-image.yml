name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
          distribution: temurin
          java-version: '17'

    - name: Build Jar
      run: ./gradlew clean bootJar

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-demo-app:latest

    - name: Push Image to Docker Hub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/spring-demo-app:latest

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1 
      with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop spring-demo || true
            docker rm spring-demo || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/spring-demo-app:latest
            docker run -d --name spring-demo -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/spring-demo-app:latest

     
      
